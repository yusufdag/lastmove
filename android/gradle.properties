org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Plugin sources live in the pub cache while `build/` sits next to the project.
# When those two are on different Windows drives, Kotlin's incremental cache
# tries to relativise absolute paths across roots and throws
# "this and base files have different roots". Disabling incremental Kotlin
# compilation keeps the Android build deterministic.
kotlin.incremental=false
